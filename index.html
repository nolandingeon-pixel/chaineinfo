<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Maison</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <!-- SDK Firebase Compatible -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161c25;
      --border-color: #2b3542;
      --text-main: #f2f5f8;
      --text-muted: #a3afbd;
      --focus-color: #ffe100;
      --active-color: #4da3ff;
      --logo-background: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      padding: 15px;
      gap: 15px;
    }

    .main-stage {
      flex: 7;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .player-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* Plein écran : natif si le navigateur le permet, sinon simulé (utile sur les navigateurs de télé) */
    .player-wrapper.fs,
    .player-wrapper:fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 50;
      border: 0;
      border-radius: 0;
    }
    .player-wrapper.fs:not(.show-bar) { cursor: none; }

    video, iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #000;
    }

    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(13, 17, 23, 0.92);
      z-index: 5;
      padding: 20px;
    }
    .player-overlay p { max-width: 520px; line-height: 1.5; color: var(--text-muted); }
    .player-overlay.hidden { display: none; }

    /* Message d'état (chargement / erreur) */
    .status {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 6;
      display: none;
      align-items: center;
      gap: 14px;
      max-width: 90%;
      padding: 12px 18px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
    }
    .status .action-btn { padding: 6px 14px; white-space: nowrap; }

    /* Barre de sortie du plein écran */
    .fs-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 8;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .player-wrapper.fs .fs-bar,
    .player-wrapper:fullscreen .fs-bar { display: flex; }
    .player-wrapper.show-bar .fs-bar { opacity: 1; pointer-events: auto; }
    .fs-title { font-size: 1.3rem; font-weight: 700; }
    .fs-hint { color: var(--text-muted); font-size: 0.95rem; margin-left: 12px; font-weight: 400; }
    .fs-bar .action-btn { font-size: 1.1rem; padding: 10px 20px; }

    /* Zone tactile en haut (les iframes ne transmettent pas les touches ni les clics) */
    .fs-hotzone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 7;
      display: none;
    }
    .player-wrapper.fs.embed .fs-hotzone,
    .player-wrapper:fullscreen.embed .fs-hotzone { display: block; }

    .control-bar {
      display: flex;
      align-items: center;
      padding-top: 10px;
      height: 60px;
      gap: 10px;
    }

    .now-playing {
      flex: 1;
      min-width: 0;
      padding: 0 6px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing strong { color: var(--text-main); }

    .control-btn, .action-btn {
      font-family: inherit;
      color: var(--text-main);
      cursor: pointer;
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 16px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .control-bar .control-btn {
      height: 100%;
      min-width: 150px;
    }
    .control-btn:disabled { opacity: 0.4; cursor: default; }

    .control-btn:focus, .action-btn:focus, .tile-btn:focus {
      outline: none;
      border-color: var(--focus-color);
      box-shadow: 0 0 8px var(--focus-color);
    }

    .sidebar {
      flex: 3;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--panel-bg);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid var(--border-color);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .channels-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      grid-auto-rows: 100px;
      gap: 10px;
      overflow-y: auto;
      padding: 4px;
    }

    .tile-btn {
      width: 100%;
      height: 100%;
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      cursor: pointer;
      font-family: inherit;
    }

    .tile-btn .logo-wrapper {
      height: 70%;
      background-color: var(--logo-background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .tile-btn img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .tile-btn .channel-name {
      height: 30%;
      line-height: 25px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 5px;
    }

    .tile-btn.active { border-color: var(--active-color); }
    .tile-btn.active .channel-name { color: var(--active-color); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.hidden { display: none; }

    .modal-box {
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      width: 420px;
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group input, .form-group select {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--focus-color);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .modal-actions .action-btn { flex: 1; }
    .action-btn.save { background-color: #1f6feb; border-color: #388bfd; }
    .action-btn.cancel { background-color: #21262d; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 70;
      background: #21262d;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 18px;
      display: none;
    }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .app-container { flex-direction: column; height: auto; min-height: 100vh; }
      .main-stage { height: 56vw; min-height: 240px; flex: none; }
      .sidebar { height: 60vh; flex: none; }
      .control-bar .control-btn { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="main-stage">
      <div class="player-wrapper" id="player-wrapper">
        <video id="hls-player" playsinline></video>
        <iframe id="iframe-player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>

        <div class="player-overlay" id="player-overlay">
          <h2>TV Maison</h2>
          <p>Choisissez une chaîne, ou changez de chaîne avec les flèches ↑ / ↓.<br>
             Appuyez sur OK sur la chaîne en cours pour passer en plein écran, et sur Retour ou OK pour en sortir.</p>
        </div>

        <div class="status" id="status">
          <span id="status-text"></span>
          <button id="btn-retry" class="action-btn" style="display:none;">Réessayer</button>
        </div>

        <div class="fs-hotzone" id="fs-hotzone"></div>
        <div class="fs-bar" id="fs-bar">
          <div class="fs-title"><span id="fs-title"></span><span class="fs-hint">Retour ou OK pour quitter</span></div>
          <button id="btn-exit-fs" class="action-btn">✕ Quitter le plein écran</button>
        </div>
      </div>

      <div class="control-bar">
        <div class="now-playing" id="now-playing">Aucune chaîne sélectionnée</div>
        <button id="btn-play-pause" class="control-btn">Pause</button>
        <button id="btn-fullscreen" class="control-btn">Plein écran</button>
      </div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 style="margin:0; font-size:1.4rem;">Chaînes</h1>
        <button id="btn-open-modal" class="action-btn">+ Ajouter</button>
      </div>
      <div class="channels-grid" id="channels-grid"></div>
    </aside>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal-box">
      <h3 style="margin:0;">Ajouter une chaîne</h3>
      <div class="form-group">
        <label for="input-name">Nom :</label>
        <input type="text" id="input-name" placeholder="Ex: Franceinfo">
      </div>
      <div class="form-group">
        <label for="input-logo">Logo (URL, facultatif) :</label>
        <input type="text" id="input-logo" placeholder="https://...">
      </div>
      <div class="form-group">
        <label for="input-url">Flux ou intégration (URL) :</label>
        <input type="text" id="input-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label for="select-type">Type :</label>
        <select id="select-type">
          <option value="hls">Flux direct (.m3u8)</option>
          <option value="embed">Intégration Web (Dailymotion)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="btn-save-channel" class="action-btn save">Enregistrer</button>
        <button id="btn-close-modal" class="action-btn cancel">Annuler</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>

    // Chaînes retirées de la liste par défaut : elles sont supprimées de Firebase à la resynchronisation
    var REMOVED_CHANNELS = [

    /* ---------- Petits utilitaires ---------- */

    function showToast(msg) {
      var t = getEl('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.style.display = 'none'; }, 4500);
    }

    function setStatus(text, withRetry) {
      if (!text) { statusEl.style.display = 'none'; return; }
      statusTextEl.textContent = text;
      retryBtn.style.display = withRetry ? 'inline-block' : 'none';
      statusEl.style.display = 'flex';
    }

    function keyOf(name) { return String(name).toLowerCase().replace(/\s+/g, ' ').trim(); }

    /* ---------- Logos : plusieurs sources, puis pastille avec les initiales ---------- */

    // Wikimedia n'accepte que certaines largeurs de miniatures (ex. 512px est refusé : on prend 500px)
    var WIKI_WIDTHS = [20, 40, 60, 120, 250, 330, 500, 960, 1280, 1920, 3840];
    function fixLogoUrl(url) {
      if (url.indexOf('upload.wikimedia.org') === -1 || url.indexOf('/thumb/') === -1) return url;
      return url.replace(/\/(\d+)px-/, function(match, n) {
        var w = parseInt(n, 10), best = WIKI_WIDTHS[0];
        for (var i = 0; i < WIKI_WIDTHS.length; i++) { if (WIKI_WIDTHS[i] <= w) best = WIKI_WIDTHS[i]; }
        return '/' + best + 'px-';
      });
    }

    function logoSources(channel) {
      var sources = [];
      var logo = (channel.logo || '').trim();
      if (logo && logo.indexOf('via.placeholder.com') === -1) sources.push(fixLogoUrl(logo));
      if (channel.site) {
        sources.push('https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(channel.site));
        sources.push('https://icons.duckduckgo.com/ip3/' + encodeURIComponent(channel.site) + '.ico');
      }
      return sources;
    }

    function initialsLogo(name) {
      var hash = 0;
      for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
      var words = name.replace(/[^A-Za-z0-9À-ÿ ]/g, ' ').trim().split(/\s+/);
      var initials = (words[0] ? words[0].charAt(0) : '?') + (words[1] ? words[1].charAt(0) : '');
      initials = initials.toUpperCase().replace(/[<>&]/g, '');
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">' +
        '<rect width="120" height="80" rx="10" fill="hsl(' + hash + ',55%,32%)"/>' +
        '<text x="60" y="53" font-family="Arial,sans-serif" font-size="34" font-weight="700" ' +
        'fill="#ffffff" text-anchor="middle">' + initials + '</text></svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function buildLogo(channel) {
      var img = document.createElement('img');
      var sources = logoSources(channel);
      var step = 0;
      img.alt = '';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';

      function next() {
        step++;
        if (step < sources.length) {
          img.src = sources[step];
        } else {
          img.onerror = null;
          img.onload = null;
          img.src = initialsLogo(channel.name);
        }
      }
      img.onerror = next;
      // Les services de favicons renvoient une petite icône « globe » quand le site n'a pas de logo :
      // on la rejette pour passer à la pastille avec les initiales.
      img.onload = function() {
        var isFavicon = /favicons|duckduckgo/.test(img.src);
        if (isFavicon && img.naturalWidth && img.naturalWidth < 48) next();
      };
      img.src = sources.length ? sources[0] : initialsLogo(channel.name);
      return img;
    }

    /* ---------- Liste des chaînes (Firebase) ---------- */

    function normalizeList(data) {
      if (!data) return [];
      var arr = Array.isArray(data) ? data : Object.keys(data).map(function(k) { return data[k]; });
      return arr.filter(function(c) { return c && c.name && c.url; });
    }

    // Les chaînes par défaut passent en premier (dans l'ordre du code), puis vos chaînes ajoutées.
    // Les chaînes retirées (REMOVED_CHANNELS) disparaissent.
    function mergeDefaults(list) {
      var used = {};
      var out = DEFAULT_CHANNELS.map(function(d) {
        used[keyOf(d.name)] = true;
        return JSON.parse(JSON.stringify(d));
      });
      REMOVED_CHANNELS.forEach(function(n) { used[keyOf(n)] = true; });
      list.forEach(function(c) {
        if (!used[keyOf(c.name)]) out.push(c);
      });
      return out;
    }

    function cleanForFirebase(list) { return JSON.parse(JSON.stringify(list)); }

    function setChannels(list) {
      if (appStarted && JSON.stringify(list) === JSON.stringify(channelsList) && gridEl.children.length) return;

      var activeUrl = (activeIndex > -1 && channelsList[activeIndex]) ? channelsList[activeIndex].url : null;
      channelsList = list;
      activeIndex = -1;
      if (activeUrl) {
        for (var i = 0; i < list.length; i++) {
          if (list[i].url === activeUrl) { activeIndex = i; break; }
        }
      }
      renderChannelsGrid();
    }

    function startApp(list) {
      if (appStarted) return;
      setChannels(list);
      appStarted = true;
      channelsRef.on('value', function(snapshot) {
        var fresh = normalizeList(snapshot.val());
        if (fresh.length) setChannels(fresh);
      }, function(err) {
        console.warn('Firebase (écoute) :', err);
      });
    }

    Promise.all([
      channelsRef.once('value'),
      metaRef.once('value').catch(function() { return null; })
    ]).then(function(res) {
      var list = normalizeList(res[0].val());
      var version = res[1] ? (res[1].val() || 0) : 0;
      if (!list.length || version < DEFAULTS_VERSION) {
        list = mergeDefaults(list);
        channelsRef.set(cleanForFirebase(list)).catch(function(e) { console.warn('Firebase (écriture) :', e); });
        metaRef.set(DEFAULTS_VERSION).catch(function() {});
      }
      startApp(list);
    }).catch(function(err) {
      console.warn('Firebase indisponible, liste locale utilisée :', err);
      showToast('Connexion à Firebase impossible : liste locale utilisée.');
      startApp(mergeDefaults([]));
    });

    // Si Firebase ne répond pas, on affiche quand même les chaînes par défaut
    setTimeout(function() { if (!appStarted) startApp(mergeDefaults([])); }, 8000);

    /* ---------- Grille ---------- */

    function renderChannelsGrid() {
      var focusIdx = -1;
      var ae = document.activeElement;
      if (ae && ae.classList && ae.classList.contains('tile-btn')) {
        focusIdx = parseInt(ae.getAttribute('data-index'), 10);
      }

      gridEl.innerHTML = '';
      channelsList.forEach(function(channel, index) {
        var btn = document.createElement('button');
        btn.className = 'tile-btn' + (index === activeIndex ? ' active' : '');
        btn.setAttribute('data-index', index);
        btn.title = channel.name;
        btn.onclick = function() { onTileClick(index); };

        var logoDiv = document.createElement('div');
        logoDiv.className = 'logo-wrapper';
        logoDiv.appendChild(buildLogo(channel));

        var nameDiv = document.createElement('div');
        nameDiv.className = 'channel-name';
        nameDiv.textContent = channel.name;

        btn.appendChild(logoDiv);
        btn.appendChild(nameDiv);
        gridEl.appendChild(btn);
      });

      if (focusIdx > -1 && gridEl.children[focusIdx]) gridEl.children[focusIdx].focus();
    }

    function setActiveTile(index, takeFocus) {
      for (var i = 0; i < gridEl.children.length; i++) {
        gridEl.children[i].classList.toggle('active', i === index);
      }
      var tile = gridEl.children[index];
      if (tile) {
        if (takeFocus && tile.focus) tile.focus();
        if (tile.scrollIntoView) tile.scrollIntoView({ block: 'nearest' });
      }
    }

    function onTileClick(index) {
      // OK sur la chaîne déjà en cours : plein écran
      if (index === activeIndex && channelState !== 'error' && channelState !== 'idle') {
        enterFullscreen();
      } else {
        playChannel(index, false);
      }
    }

    /* ---------- Lecture ---------- */

    var playToken = 0;          // identifie la lecture en cours : les anciennes réponses sont ignorées
    var attemptIndex = 0;       // source en cours d'essai pour la chaîne active
    var currentSources = [];
    var loadTimer = null;
    var autoMuted = false;      // vrai si le navigateur nous a forcés à couper le son

    function sourcesOf(channel) {
      var list = [{ type: channel.type, url: channel.url }];
      var alt = channel.alt;
      if (alt) {
        var arr = Array.isArray(alt) ? alt : Object.keys(alt).map(function(k) { return alt[k]; });
        arr.forEach(function(a) { if (a && a.url) list.push({ type: a.type || 'hls', url: a.url }); });
      }
      return list;
    }

    function stopPlayback() {
      clearTimeout(loadTimer);
      if (hlsPlayerInstance) {
        hlsPlayerInstance.destroy();
        hlsPlayerInstance = null;
      }
      try { videoEl.pause(); } catch (e) {}
      videoEl.removeAttribute('src');
      videoEl.load();
      iframeEl.onload = null;
      if (iframeEl.getAttribute('src') && iframeEl.getAttribute('src') !== 'about:blank') iframeEl.src = 'about:blank';
      videoEl.style.display = 'none';
      iframeEl.style.display = 'none';
    }

    function failPlayback(message) {
      clearTimeout(loadTimer);
      channelState = 'error';
      setStatus(message, true);
    }

    function unmuteIfNeeded() {
      if (!autoMuted) return;
      autoMuted = false;
      videoEl.muted = false;
      getEl('toast').style.display = 'none';
    }
    // Le premier appui / clic après une coupure automatique remet le son
    document.addEventListener('keydown', unmuteIfNeeded, true);
    document.addEventListener('click', unmuteIfNeeded, true);

    function tryPlay(token) {
      var p = videoEl.play();
      if (p && p.catch) {
        p.catch(function(err) {
          if (token !== playToken) return;                 // réponse d'une ancienne chaîne : on l'ignore
          if (err && err.name === 'NotAllowedError') {     // seul vrai cas de blocage du son par le navigateur
            videoEl.muted = true;
            autoMuted = true;
            var p2 = videoEl.play();
            if (p2 && p2.catch) p2.catch(function() {});
            showToast('Le navigateur bloque le son automatique : appuyez sur OK (ou cliquez) pour l\'activer.');
          }
          // AbortError : un chargement plus récent a pris le relais, rien à faire
        });
      }
    }

    // Passe à la source suivante de la chaîne, ou abandonne s'il n'y en a plus
    function nextSource(token) {
      if (token !== playToken) return;
      attemptIndex++;
      if (attemptIndex < currentSources.length) {
        startAttempt(token);
      } else {
        stopPlayback();
        failPlayback('Cette chaîne ne répond pas pour le moment (flux coupé, bloqué ou hors de votre région).');
      }
    }

    function startAttempt(token) {
      if (token !== playToken) return;
      var channel = channelsList[activeIndex];
      var src = currentSources[attemptIndex];
      if (!channel || !src) return;

      stopPlayback();
      videoEl.muted = false;
      autoMuted = false;
      channelState = 'loading';
      playerWrapperEl.classList.toggle('embed', src.type === 'embed');
      pauseBtn.disabled = (src.type === 'embed');
      pauseBtn.textContent = 'Pause';

      if (location.protocol === 'https:' && /^http:\/\//i.test(src.url)) {
        nextSource(token);          // un flux http est bloqué depuis une page https
        return;
      }

      var label = currentSources.length > 1 ? ' (source ' + (attemptIndex + 1) + '/' + currentSources.length + ')' : '';
      setStatus('Chargement de ' + channel.name + label + '…', false);

      if (src.type === 'embed') {
        iframeEl.style.display = 'block';
        iframeEl.onload = function() { channelState = 'playing'; setStatus(''); };
        iframeEl.src = src.url;
        return;
      }

      videoEl.style.display = 'block';
      // Si rien ne démarre au bout de 15 s, on tente la source suivante
      loadTimer = setTimeout(function() {
        if (token === playToken && channelState !== 'playing') nextSource(token);
      }, 15000);

      if (window.Hls && Hls.isSupported()) {
        var started = false;
        var networkRetries = 0;
        var mediaRetries = 0;
        var hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 30,
          backBufferLength: 30,
          manifestLoadingMaxRetry: 1,
          manifestLoadingRetryDelay: 500,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 4
        });
        hlsPlayerInstance = hls;

        hls.on(Hls.Events.MANIFEST_PARSED, function() { tryPlay(token); });
        hls.on(Hls.Events.FRAG_LOADED, function() { started = true; networkRetries = 0; });
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (token !== playToken || !data || !data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR && started && networkRetries < 3) {
            networkRetries++;
            setStatus('Connexion instable, nouvelle tentative (' + networkRetries + '/3)…', false);
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries < 3) {
            mediaRetries++;
            hls.recoverMediaError();
          } else {
            nextSource(token);
          }
        });

        hls.loadSource(src.url);
        hls.attachMedia(videoEl);
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = src.url;
        tryPlay(token);
      } else {
        failPlayback('Ce navigateur ne sait pas lire les flux .m3u8.');
      }
    }

    function playChannel(index, fromZap) {
      if (index < 0 || index >= channelsList.length) return;

      activeIndex = index;
      var channel = channelsList[index];
      playToken++;
      currentSources = sourcesOf(channel);
      attemptIndex = 0;

      overlayEl.className = 'player-overlay hidden';
      setActiveTile(index, fromZap && !fsActive);

      nowPlayingEl.innerHTML = '';
      var strong = document.createElement('strong');
      strong.textContent = channel.name;
      nowPlayingEl.appendChild(strong);
      fsTitleEl.textContent = channel.name;
      if (fsActive) showFsBar();

      startAttempt(playToken);
    }

    function zap(delta) {
      var n = channelsList.length;
      if (!n) return;
      var next;
      if (activeIndex < 0) next = delta > 0 ? 0 : n - 1;
      else next = (activeIndex + delta + n) % n;
      playChannel(next, true);
    }

    // Suivi de l'état réel du lecteur vidéo
    videoEl.addEventListener('playing', function() {
      clearTimeout(loadTimer);
      channelState = 'playing';
      setStatus('');
      pauseBtn.textContent = 'Pause';
    });
    videoEl.addEventListener('waiting', function() {
      if (channelState !== 'error' && videoEl.style.display !== 'none') setStatus('Mise en mémoire tampon…', false);
    });
    videoEl.addEventListener('pause', function() {
      if (videoEl.style.display !== 'none') pauseBtn.textContent = 'Lecture';
    });
    videoEl.addEventListener('play', function() { pauseBtn.textContent = 'Pause'; });
    videoEl.addEventListener('error', function() {
      // Uniquement pour la lecture native (hls.js gère lui-même ses erreurs et ses reprises)
      if (!hlsPlayerInstance && videoEl.getAttribute('src')) nextSource(playToken);
    });

    function togglePause() {
      if (videoEl.style.display === 'none') return;
      if (videoEl.paused) tryPlay(playToken); else videoEl.pause();
    }

    pauseBtn.onclick = togglePause;
    retryBtn.onclick = function() { if (activeIndex > -1) playChannel(activeIndex, false); };

    /* ---------- Plein écran (natif si possible, sinon simulé) ---------- */

    function nativeFsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }

    function showFsBar() {
      playerWrapperEl.classList.add('show-bar');
      clearTimeout(fsBarTimer);
      fsBarTimer = setTimeout(function() { playerWrapperEl.classList.remove('show-bar'); }, 4000);
    }

    function enterFullscreen() {
      if (fsActive) return;
      fsActive = true;
      fsAt = Date.now();
      playerWrapperEl.classList.add('fs');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

      var req = playerWrapperEl.requestFullscreen || playerWrapperEl.webkitRequestFullscreen;
      if (req) {
        try {
          var p = req.call(playerWrapperEl);
          if (p && p.catch) p.catch(function() {});   // sinon : le mode simulé (CSS) suffit
        } catch (e) {}
      }
      showFsBar();
    }

    function exitFullscreen() {
      if (!fsActive) return;
      fsActive = false;
      clearTimeout(fsBarTimer);
      playerWrapperEl.classList.remove('fs', 'show-bar');

      if (nativeFsElement()) {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) { try { var p = ex.call(document); if (p && p.catch) p.catch(function() {}); } catch (e) {} }
      }
      // On redonne le focus à la chaîne en cours pour continuer à naviguer à la télécommande
      var tile = gridEl.children[activeIndex];
      if (tile && tile.focus) tile.focus();
    }

    function toggleFullscreen() { if (fsActive) exitFullscreen(); else enterFullscreen(); }

    function onNativeFsChange() {
      // L'utilisateur a quitté le plein écran natif (touche Échap / Retour du navigateur)
      if (!nativeFsElement() && fsActive) exitFullscreen();
    }
    document.addEventListener('fullscreenchange', onNativeFsChange);
    document.addEventListener('webkitfullscreenchange', onNativeFsChange);

    getEl('btn-fullscreen').onclick = toggleFullscreen;
    getEl('btn-exit-fs').onclick = exitFullscreen;

    // Souris / toucher : fait apparaître la barre « Quitter » ; double-clic sur l'image : bascule
    playerWrapperEl.addEventListener('mousemove', function() { if (fsActive) showFsBar(); });
    playerWrapperEl.addEventListener('touchstart', function() { if (fsActive) showFsBar(); }, { passive: true });
    playerWrapperEl.addEventListener('click', function() { if (fsActive) showFsBar(); });
    getEl('fs-hotzone').addEventListener('mousemove', showFsBar);
    getEl('fs-hotzone').addEventListener('click', showFsBar);
    videoEl.addEventListener('dblclick', toggleFullscreen);

    /* ---------- Télécommande / clavier ---------- */

    function isBackKey(e) {
      var k = e.key, c = e.keyCode;
      return k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack' || k === 'XF86Back' ||
             c === 27 || c === 8 || c === 10009 /* Tizen */ || c === 461 /* webOS */ || c === 4 /* Android */ || c === 166;
    }

    document.addEventListener('keydown', function(e) {
      var k = e.key, c = e.keyCode;

      if (!modalEl.classList.contains('hidden')) {
        if (k === 'Escape' || c === 10009 || c === 461) closeModal();
        return;
      }

      var isEnter = (k === 'Enter' || c === 13);

      // En plein écran : Retour ou OK = quitter (n'importe quelle touche ré-affiche la barre)
      if (fsActive) {
        showFsBar();
        if (isBackKey(e) || isEnter) {
          e.preventDefault();
          if (!e.repeat && Date.now() - fsAt > 500) exitFullscreen();
          return;
        }
      }

      if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'ChannelUp' || k === 'PageUp' || c === 427) {
        e.preventDefault();
        zap(-1);
      } else if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'ChannelDown' || k === 'PageDown' || c === 428) {
        e.preventDefault();
        zap(1);
      } else if (k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || c === 179) {
        e.preventDefault();
        togglePause();
      } else if (k === 'f' || k === 'F') {
        toggleFullscreen();
      }
    });

    /* ---------- Ajout d'une chaîne ---------- */

    function openModal() {
      modalEl.className = 'modal-backdrop';
      getEl('input-name').focus();
    }
    function closeModal() {
      modalEl.className = 'modal-backdrop hidden';
      var tile = gridEl.children[activeIndex];
      if (tile && tile.focus) tile.focus();
    }

    getEl('btn-open-modal').onclick = openModal;
    getEl('btn-close-modal').onclick = closeModal;

    getEl('btn-save-channel').onclick = function() {
      var name = getEl('input-name').value.trim();
      var logo = getEl('input-logo').value.trim();
      var url = getEl('input-url').value.trim();
      var type = getEl('select-type').value;

      if (!name || !url) { showToast('Le nom et l\'URL du flux sont obligatoires.'); return; }
      if (!/^https?:\/\//i.test(url)) { showToast('L\'URL doit commencer par http:// ou https://'); return; }

      var updated = channelsList.concat([{ name: name, logo: logo, url: url, type: type, site: '' }]);
      setChannels(updated);
      channelsRef.set(cleanForFirebase(updated)).catch(function() {
        showToast('Chaîne ajoutée ici, mais l\'enregistrement Firebase a échoué.');
      });

      closeModal();
      getEl('input-name').value = '';
      getEl('input-logo').value = '';
      getEl('input-url').value = '';
    };
  </script>
</body>
</html>
