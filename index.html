<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Maison</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  
  <!-- SDK Firebase Compatible -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161c25;
      --border-color: #2b3542;
      --text-main: #f2f5f8;
      --text-muted: #a3afbd;
      --focus-color: #ffe100;
      --active-color: #4da3ff;
      --logo-background: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      padding: 15px;
      gap: 15px;
    }

    .main-stage {
      flex: 7;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .player-wrapper {
      position: relative;
      flex: 1;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* Mode plein écran sur le lecteur uniquement */
    .player-wrapper:fullscreen video,
    .player-wrapper:fullscreen iframe {
      width: 100vw;
      height: 100vh;
    }

    video, iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
    }

    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(13, 17, 23, 0.92);
      z-index: 5;
      padding: 20px;
    }

    .player-overlay.hidden { display: none; }

    .control-bar {
      display: flex;
      align-items: center;
      padding-top: 10px;
      height: 60px;
      gap: 10px;
    }

    .control-btn, .action-btn {
      font-family: inherit;
      color: var(--text-main);
      cursor: pointer;
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 16px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .control-bar .control-btn {
      flex: 1;
      height: 100%;
    }

    .control-btn:focus, .action-btn:focus, .tile-btn:focus {
      outline: none;
      border-color: var(--focus-color);
      box-shadow: 0 0 8px var(--focus-color);
    }

    .volume-display {
      min-width: 90px;
      text-align: center;
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: bold;
    }

    .sidebar {
      flex: 3;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--panel-bg);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid var(--border-color);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .channels-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 100px;
      gap: 10px;
      overflow-y: auto;
    }

    .tile-btn {
      width: 100%;
      height: 100%;
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      cursor: pointer;
    }

    .tile-btn .logo-wrapper {
      height: 70%;
      background-color: var(--logo-background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .tile-btn img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .tile-btn .channel-name {
      height: 30%;
      line-height: 25px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 5px;
    }

    .tile-btn.active { border-color: var(--active-color); }
    .tile-btn.active .channel-name { color: var(--active-color); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.hidden { display: none; }

    .modal-box {
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group input, .form-group select {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .modal-actions .action-btn { flex: 1; }
    .action-btn.save { background-color: #1f6feb; border-color: #388bfd; }
    .action-btn.cancel { background-color: #21262d; }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="main-stage">
      <div class="player-wrapper" id="player-wrapper">
        <video id="hls-player" playsinline></video>
        <iframe id="iframe-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div class="player-overlay" id="player-overlay">
          <h2>TV Maison</h2>
          <p>Sélectionnez une chaîne ou utilisez les flèches ↑ / ↓ du clavier.</p>
        </div>
      </div>

      <div class="control-bar">
        <button id="btn-play-pause" class="control-btn">Pause</button>
        <button id="btn-vol-down" class="control-btn">Volume −</button>
        <div class="volume-display" id="volume-label">70 %</div>
        <button id="btn-vol-up" class="control-btn">Volume +</button>
        <button id="btn-fullscreen" class="control-btn">Plein écran</button>
      </div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 style="margin:0; font-size:1.4rem;">Chaînes</h1>
        <button id="btn-open-modal" class="action-btn">+ Ajouter</button>
      </div>
      <div class="channels-grid" id="channels-grid"></div>
    </aside>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal-box">
      <h3 style="margin:0;">Ajouter une chaîne</h3>
      <div class="form-group">
        <label>Nom :</label>
        <input type="text" id="input-name" placeholder="Ex: Franceinfo">
      </div>
      <div class="form-group">
        <label>Logo (URL) :</label>
        <input type="text" id="input-logo" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Flux ou intégration (URL) :</label>
        <input type="text" id="input-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Type :</label>
        <select id="select-type">
          <option value="hls">Flux direct (.m3u8)</option>
          <option value="embed">Intégration Web (Dailymotion)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="btn-save-channel" class="action-btn save">Enregistrer</button>
        <button id="btn-close-modal" class="action-btn cancel">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyD82Pt3Ha8tKSQl0243t4TZrW83tXB52KY",
      authDomain: "chaineinfo-84ac3.firebaseapp.com",
      databaseURL: "https://chaineinfo-84ac3-default-rtdb.firebaseio.com",
      projectId: "chaineinfo-84ac3",
      storageBucket: "chaineinfo-84ac3.firebasestorage.app",
      messagingSenderId: "573964536961",
      appId: "1:573964536961:web:5c4f1a967a4766c39e1180"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var channelsRef = db.ref('channels');

    // URLs de flux et logos fonctionnels vérifiés
    var DEFAULT_CHANNELS = [
      { 
        name: "Franceinfo", 
        type: "hls", 
        url: "https://vs-cme-2.s3.eu-west-3.amazonaws.com/live/franceinfo/index.m3u8", 
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Franceinfo_2016.svg/512px-Franceinfo_2016.svg.png" 
      },
      { 
        name: "France 24", 
        type: "hls", 
        url: "https://static.france24.com/live/F24_FR_PAD_HLS/live_tv.m3u8", 
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/France_24_logo.svg/512px-France_24_logo.svg.png" 
      },
      { 
        name: "Arte", 
        type: "hls", 
        url: "https://artesimulcast.akamaized.net/hls/live/2031003/artelive_fr/index.m3u8", 
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Arte_Logo.svg/512px-Arte_Logo.svg.png" 
      },
      { 
        name: "Euronews", 
        type: "hls", 
        url: "https://euronews-euronews-french-3-fr.samsung.wurl.tv/playlist.m3u8", 
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Euronews_logo_2016.svg/512px-Euronews_logo_2016.svg.png" 
      },
      { 
        name: "BFM TV", 
        type: "hls", 
        url: "https://ncdn-live-bfm.pfd.sfr.net/shls/LIVE$BFM_TV/index.m3u8", 
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Logo_BFM_TV_%282019%29.png/512px-Logo_BFM_TV_%282019%29.png" 
      }
    ];

    var channelsList = [];
    var activeIndex = -1;
    var hlsPlayerInstance = null;
    var currentVolume = 0.7;

    function getEl(id) { return document.getElementById(id); }
    var videoEl = getEl('hls-player');
    var iframeEl = getEl('iframe-player');
    var overlayEl = getEl('player-overlay');
    var gridEl = getEl('channels-grid');
    var modalEl = getEl('modal-backdrop');
    var playerWrapperEl = getEl('player-wrapper');

    // Récupération Firebase
    channelsRef.on('value', function(snapshot) {
      var data = snapshot.val();
      if (data) {
        channelsList = Array.isArray(data) ? data : Object.values(data);
      } else {
        channelsList = DEFAULT_CHANNELS;
        channelsRef.set(DEFAULT_CHANNELS);
      }
      renderChannelsGrid();
    });

    function renderChannelsGrid() {
      gridEl.innerHTML = '';
      channelsList.forEach(function(channel, index) {
        var card = document.createElement('div');
        var btn = document.createElement('button');
        btn.className = 'tile-btn' + (index === activeIndex ? ' active' : '');
        btn.onclick = function() { playChannel(index); };

        var logoDiv = document.createElement('div');
        logoDiv.className = 'logo-wrapper';
        var img = document.createElement('img');
        img.src = channel.logo;
        img.onerror = function() { this.src = 'https://via.placeholder.com/150?text=Logo'; };
        logoDiv.appendChild(img);

        var nameDiv = document.createElement('div');
        nameDiv.className = 'channel-name';
        nameDiv.textContent = channel.name;

        btn.appendChild(logoDiv);
        btn.appendChild(nameDiv);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });
    }

    function playChannel(index) {
      if (index < 0 || index >= channelsList.length) return;

      activeIndex = index;
      var channel = channelsList[index];

      if (hlsPlayerInstance) {
        hlsPlayerInstance.destroy();
        hlsPlayerInstance = null;
      }

      videoEl.style.display = 'none';
      iframeEl.style.display = 'none';
      iframeEl.src = '';
      overlayEl.className = 'player-overlay hidden';

      if (channel.type === 'hls') {
        videoEl.style.display = 'block';
        if (Hls.isSupported()) {
          hlsPlayerInstance = new Hls();
          hlsPlayerInstance.loadSource(channel.url);
          hlsPlayerInstance.attachMedia(videoEl);
          hlsPlayerInstance.on(Hls.Events.MANIFEST_PARSED, function() { videoEl.play(); });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
          videoEl.src = channel.url;
          videoEl.play();
        }
      } else if (channel.type === 'embed') {
        iframeEl.style.display = 'block';
        iframeEl.src = channel.url;
      }

      renderChannelsGrid();
    }

    function updateVolume(delta) {
      currentVolume = Math.min(1, Math.max(0, currentVolume + delta));
      videoEl.volume = currentVolume;
      getEl('volume-label').textContent = Math.round(currentVolume * 100) + ' %';
    }

    // Gestion des touches Haut / Bas / Gauche / Droite
    document.addEventListener('keydown', function(event) {
      if (!modalEl.classList.contains('hidden')) return;

      if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
        event.preventDefault();
        var nextIndex = activeIndex - 1;
        if (nextIndex < 0) nextIndex = channelsList.length - 1;
        playChannel(nextIndex);
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
        event.preventDefault();
        var nextIndex = activeIndex + 1;
        if (nextIndex >= channelsList.length) nextIndex = 0;
        playChannel(nextIndex);
      }
    });

    getEl('btn-play-pause').onclick = function() {
      if (videoEl.style.display !== 'none') {
        if (videoEl.paused) { videoEl.play(); this.textContent = 'Pause'; }
        else { videoEl.pause(); this.textContent = 'Lecture'; }
      }
    };

    getEl('btn-vol-up').onclick = function() { updateVolume(0.1); };
    getEl('btn-vol-down').onclick = function() { updateVolume(-0.1); };

    // Plein écran ciblant uniquement la zone vidéo
    getEl('btn-fullscreen').onclick = function() {
      if (!document.fullscreenElement) {
        if (playerWrapperEl.requestFullscreen) playerWrapperEl.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    getEl('btn-open-modal').onclick = function() { modalEl.className = 'modal-backdrop'; };
    getEl('btn-close-modal').onclick = function() { modalEl.className = 'modal-backdrop hidden'; };

    getEl('btn-save-channel').onclick = function() {
      var name = getEl('input-name').value.trim();
      var logo = getEl('input-logo').value.trim();
      var url = getEl('input-url').value.trim();
      var type = getEl('select-type').value;

      if (name && url) {
        channelsList.push({
          name: name,
          logo: logo || 'https://via.placeholder.com/150',
          url: url,
          type: type
        });

        channelsRef.set(channelsList);

        modalEl.className = 'modal-backdrop hidden';
        getEl('input-name').value = '';
        getEl('input-logo').value = '';
        getEl('input-url').value = '';
      }
    };
  </script>
</body>
</html>
