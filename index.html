<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Maison</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161c25;
    --line: #2b3542;
    --text: #f2f5f8;
    --muted: #a3afbd;
    --focus: #ffe100;
    --live: #4da3ff;
    --logo-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, sans-serif;
  }
  .app { display: flex; height: 100%; padding: 1.5vh 1vw; }

  /* Stage & Player */
  .stage { width: 70%; display: flex; flex-direction: column; padding-right: 1vw; }
  .player { position: relative; flex: 1; background: #000; border-radius: 12px; overflow: hidden; }
  video, iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: none; }

  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(13,17,23,.92); z-index: 5; padding: 2vw;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0 0 1vh; font-size: 2vw; }
  .overlay p { color: var(--muted); margin: 0; font-size: 1.2vw; }

  /* Controls */
  .controls { display: flex; align-items: center; padding-top: 1vh; height: 8vh; gap: .5vw; }
  .vol { min-width: 8vw; text-align: center; font-size: 1vw; color: var(--muted); }
  button {
    font-family: inherit; color: var(--text); cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
    font-size: 1vw; font-weight: 600; padding: .6vh 1vw;
  }
  .controls button { flex: 1; height: 100%; }
  button:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 10px var(--focus); }

  /* Side Menu */
  .side { width: 30%; display: flex; flex-direction: column; }
  .side-header { display: flex; justify-content: space-between; align-items: center; height: 5vh; }
  .side-title { margin: 0; font-size: 1.4vw; }
  .grid { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; overflow-y: auto; gap: .5vw; padding-top: 1vh; }
  .cell { width: 48%; height: 12vh; }
  .tile { width: 100%; height: 100%; padding: 0; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .tile .logo { height: 70%; background: var(--logo-bg); display: flex; align-items: center; justify-content: center; }
  .tile img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .tile .name { height: 30%; background: var(--panel); line-height: 3.5vh; font-size: .9vw; color: var(--muted); }
  .tile.on { border-color: var(--live); }
  .tile.on .name { color: var(--live); }

  /* Modal Formulaire */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 2vw; width: 400px; display: flex; flex-direction: column; gap: 1vh;
  }
  .modal-content h3 { margin: 0 0 1vh; }
  .modal-content input, .modal-content select {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: .8vh; border-radius: 6px; font-size: 1em;
  }
  .modal-actions { display: flex; gap: .5vw; margin-top: 1vh; }
  .modal-actions button { flex: 1; }
</style>
</head>
<body>

<div class="app">
  <main class="stage">
    <div class="player">
      <video id="video" playsinline></video>
      <iframe id="frame" allow="autoplay; fullscreen"></iframe>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">TV Maison</h2>
        <p id="ovText">Sélectionnez une chaîne dans la liste.</p>
      </div>
    </div>
    <div class="controls">
      <button id="btnPlay">Pause</button>
      <button id="btnVolDown">Volume −</button>
      <div class="vol" id="volLabel">70 %</div>
      <button id="btnVolUp">Volume +</button>
      <button id="btnFull">Plein écran</button>
    </div>
  </main>

  <aside class="side">
    <div class="side-header">
      <h1 class="side-title">Chaînes</h1>
      <button id="btnAddChain">+ Ajouter</button>
    </div>
    <div class="grid" id="grid"></div>
  </aside>
</div>

<!-- Modal d'ajout de chaîne -->
<div class="modal hidden" id="modal">
  <div class="modal-content">
    <h3>Ajouter une chaîne</h3>
    <input type="text" id="inName" placeholder="Nom de la chaîne (ex: France 24)">
    <input type="text" id="inLogo" placeholder="URL du logo (.png, .jpg)">
    <input type="text" id="inUrl" placeholder="URL du flux (.m3u8 ou lien embed)">
    <select id="inType">
      <option value="hls">Flux direct (.m3u8)</option>
      <option value="embed">Intégration Web (Iframe / Dailymotion)</option>
    </select>
    <div class="modal-actions">
      <button id="btnSave">Enregistrer</button>
      <button id="btnCancel">Annuler</button>
    </div>
  </div>
</div>

<script>
// Chaînes par défaut
var DEFAULT_CHANNELS = [
  { name: "Arte", type: "hls", url: "https://artesimulcast.akamaized.net/hls/live/2031003/artelive_fr/index.m3u8", logo: "https://api-cdn.arte.tv/img/v2/image/j4EoSJjX26uySVWdmt3EmS/1920x1080" },
  { name: "BFM TV", type: "hls", url: "https://ncdn-live-bfm.pfd.sfr.net/shls/LIVE$BFM_TV/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/b/b6/Logo_BFM_TV_%282019%29.png" },
  { name: "France 24", type: "hls", url: "https://static.france24.com/live/F24_FR_PAD_HLS/live_tv.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/France_24_logo.svg/500px-France_24_logo.svg.png" },
  { name: "CNews", type: "embed", url: "https://www.dailymotion.com/embed/video/x3b68jn?autoplay=1", logo: "https://i.imgur.com/UMRGAHx.png" },
  { name: "Euronews", type: "hls", url: "https://euronews-euronews-french-3-fr.samsung.wurl.tv/playlist.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Euronews_logo_2016.svg/500px-Euronews_logo_2016.svg.png" },
  { name: "BFM Business", type: "hls", url: "https://ncdn-live-bfmbusiness.pfd.sfr.net/shls/LIVE$BFM_BUSINESS/index.m3u8", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/BFM_Business_2019.svg/500px-BFM_Business_2019.svg.png" }
];

var channels = [];
var current = -1, hls = null, vol = 0.7;

var $ = function(id) { return document.getElementById(id); };
var video = $('video'), frame = $('frame'), overlay = $('overlay');

function loadCustomChannels() {
  var saved = localStorage.getItem('tv_custom_channels');
  if (saved) {
    try { channels = JSON.parse(saved); } catch(e) { channels = DEFAULT_CHANNELS; }
  } else {
    channels = DEFAULT_CHANNELS;
  }
}

function renderGrid() {
  var grid = $('grid');
  grid.innerHTML = '';
  channels.forEach(function(ch, i) {
    var cell = document.createElement('div'); cell.className = 'cell';
    var btn = document.createElement('button'); btn.className = 'tile';
    btn.onclick = function() { play(i); };
    
    var logo = document.createElement('div'); logo.className = 'logo';
    var img = document.createElement('img'); img.src = ch.logo;
    logo.appendChild(img);
    
    var name = document.createElement('div'); name.className = 'name'; name.textContent = ch.name;
    
    btn.appendChild(logo); btn.appendChild(name);
    cell.appendChild(btn); grid.appendChild(cell);
  });
}

function play(i) {
  current = i;
  var ch = channels[i];
  if (hls) { hls.destroy(); hls = null; }
  video.style.display = 'none'; frame.style.display = 'none';
  overlay.className = 'overlay hidden';

  if (ch.type === 'hls') {
    video.style.display = 'block';
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(ch.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = ch.url;
      video.play();
    }
  } else if (ch.type === 'embed') {
    frame.style.display = 'block';
    frame.src = ch.url;
  }
}

// Gestion des contrôles
$('btnPlay').onclick = function() { if (video.paused) video.play(); else video.pause(); };
$('btnVolUp').onclick = function() { setVol(0.1); };
$('btnVolDown').onclick = function() { setVol(-0.1); };
function setVol(delta) {
  vol = Math.min(1, Math.max(0, vol + delta));
  video.volume = vol;
  $('volLabel').textContent = Math.round(vol * 100) + ' %';
}
$('btnFull').onclick = function() {
  var stage = document.querySelector('.stage');
  if (!document.fullscreenElement) stage.requestFullscreen();
  else document.exitFullscreen();
};

// Panneau d'ajout (Modal)
$('btnAddChain').onclick = function() { $('modal').className = 'modal'; };
$('btnCancel').onclick = function() { $('modal').className = 'modal hidden'; };
$('btnSave').onclick = function() {
  var name = $('inName').value, logo = $('inLogo').value, url = $('inUrl').value, type = $('inType').value;
  if (name && url) {
    channels.push({ name: name, logo: logo, url: url, type: type });
    localStorage.setItem('tv_custom_channels', JSON.stringify(channels));
    renderGrid();
    $('modal').className = 'modal hidden';
    $('inName').value = $('inLogo').value = $('inUrl').value = '';
  }
};

// Initialisation
loadCustomChannels();
renderGrid();
</script>
</body>
</html>
