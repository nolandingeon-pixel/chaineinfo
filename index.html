<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Maison</title>
  <!-- HLS.js : le moteur qui lit les flux vidéo .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    /* Cadre vidéo géant adapté à la télé */
    .screen {
      width: 100%;
      max-width: 1100px;
      height: 60vh;
      margin: 0 auto 20px auto;
      background: #000;
      border-radius: 12px;
      border: 2px solid #222;
      overflow: hidden;
    }
    
    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Grille de gros boutons faciles à cliqueter à la télécommande */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .btn {
      background: #1a1a1a;
      color: #fff;
      border: 3px solid #333;
      padding: 18px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      min-width: 160px;
    }

    /* Contour bleu quand on navigue dessus à la télécommande (focus) */
    .btn:hover, .btn:focus {
      background: #0066cc;
      border-color: #66b2ff;
      transform: scale(1.05);
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Écran principal -->
  <div class="screen" id="screen">
    <video id="player" controls autoplay></video>
  </div>

  <!-- Les Chaînes -->
  <div class="grid">
    <button class="btn" onclick="playEmbed('https://www.tf1.fr/tf1/direct')">1 - TF1</button>
    <button class="btn" onclick="playStream('https://pass-f24.akamaized.net/hls/live/2012700/f24/hls_video/FR/master.m3u8')">France 24</button>
    <button class="btn" onclick="playStream('https://iptv-org.github.io/iptv/countries/fr.m3u')">14 - France 4</button>
    <button class="btn" onclick="playStream('https://ncdn-live-bfm.pfd.sfr.net/shls/LIVE$BFM_TV/index.m3u8')">BFM TV</button>
  </div>

  <script>
    const screen = document.getElementById('screen');
    let hls = null;

    // Fonction pour les chaînes gratuites en direct (m3u8)
    function playStream(url) {
      if (hls) hls.destroy();
      screen.innerHTML = '<video id="player" controls autoplay></video>';
      const video = document.getElementById('player');

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    // Fonction pour TF1 (Iframe pour éviter les blocages de sécurité)
    function playEmbed(url) {
      if (hls) hls.destroy();
      screen.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen"></iframe>`;
    }

    // Lance France 4 au démarrage
    playStream('https://iptv-org.github.io/iptv/countries/fr.m3u');
  </script>

</body>
</html>
